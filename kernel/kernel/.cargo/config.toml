[build]
target = "x86_64-unknown-none"

# 从 kernel/ 目录运行 cargo（`cargo build --release`）自动套这个 target。
#
# build-std 放在这里而不是 workspace 根，是有原因的：放在根会让宿主工具
# lumeos-boot 也被 build-std，宿主编译同时看到「std 的 core」和「现编的 core」，
# 报 E0152 duplicate lang item `sized`。
[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
